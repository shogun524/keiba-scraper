name: 過去の3連単オッズが取れるかの診断(一時)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          for rid in 202344111511 202544110511 202655110901 202630111001; do
            for t in b8 b7 b1; do curl -sL -A "$UA" "https://nar.netkeiba.com/odds/index.html?type=$t&race_id=$rid" -o out/page_${rid}_$t.html; done
            for t in 8 1; do
              curl -sL -A "$UA" -e "https://nar.netkeiba.com/odds/index.html?race_id=$rid" "https://nar.netkeiba.com/api/api_get_nar_odds.html?race_id=$rid&type=$t&action=init&compress=0" -o out/api_${rid}_$t.json
              curl -sL -A "$UA" -e "https://nar.netkeiba.com/odds/index.html?race_id=$rid" "https://nar.netkeiba.com/api/api_get_jra_odds.html?race_id=$rid&type=$t&action=init&compress=0" -o out/api2_${rid}_$t.json
            done
          done
          ls -la out; for f in out/api*; do echo "== $f"; head -c 300 $f; echo; done
          for f in out/page_*b8.html; do echo "== $f"; grep -o 'Odds[^<]\{0,80\}' $f | head -3; grep -c '<td' $f; done
          zip -qr odds_diag.zip out
          gh release upload diagnostics odds_diag.zip --clobber -R ${{ github.repository }}
        env: { GH_TOKEN: "${{ github.token }}" }
