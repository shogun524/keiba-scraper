name: 診断(一時)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for j in odds_ninki odds_tanfuku odds_form_waku odds_form odds_common odds_ranking; do curl -sL "https://cdnv2.netkeiba.com/img.nar/common/js/race/$j.js" -o $j.js; done
          curl -sL -A "Mozilla/5.0" "https://nar.netkeiba.com/odds/index.html?type=b8&race_id=202630111001&housiki=c99" -o p.html
          grep -n -A20 "function view_3odds_ranking\|view_3odds_ranking *=" *.js p.html | head -80
