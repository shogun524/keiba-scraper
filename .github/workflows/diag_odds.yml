name: 過去の3連単オッズが取れるかの診断(一時)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out; UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          for rid in 202344111511 202544110511 202630111001 202442100101; do
            for q in "housiki=c99" "housiki=c0&jiku=1" "jiku=1" "housiki=c99&ninki=1"; do
              f=out/form_${rid}_$(echo $q | tr '=&' '__').html
              curl -sL -A "$UA" -e "https://nar.netkeiba.com/odds/index.html?type=b8&race_id=$rid" "https://nar.netkeiba.com/odds/odds_get_form.html?type=b8&race_id=$rid&$q" -o $f
              echo "== $f $(wc -c < $f) td=$(grep -o '<td' $f | wc -l)"
              sed 's/<[^>]*>/ /g' $f | tr -s ' \n' ' ' | head -c 400; echo
            done
          done
          ls -la out; for f in out/api*; do echo "== $f"; head -c 300 $f; echo; done
          for f in out/page_*b8.html; do echo "== $f"; grep -o 'Odds[^<]\{0,80\}' $f | head -3; grep -c '<td' $f; done
          zip -qr odds_diag.zip out
          gh release upload diagnostics odds_diag.zip --clobber -R ${{ github.repository }}
        env: { GH_TOKEN: "${{ github.token }}" }
