name: 南関東競馬 締切間近オッズ更新

on:
  schedule:
    # 10分おき、レース開催時間帯のみ(12:00〜22:00 JST = 03:00〜13:00 UTC)
    # GitHub Actionsのcronは指定時刻ちょうどに実行される保証はなく、
    # 特に毎時00分は他リポジトリのジョブと重なり数分遅延することがある。
    - cron: "*/10 1-12 * * *"   # 10:00〜21:59 JST(昼開催の門別・盛岡なども対象)
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD、空なら当日)"
        required: false
        default: ""
      window_min:
        description: "発走何分前までを対象にするか"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  rescrape-near-deadline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージインストール
        run: |
          pip install -r requirements.txt duckdb scipy
          playwright install --with-deps chromium

      - name: 締切間近レースの再取得
        working-directory: scraper
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi
          WINDOW="${{ github.event.inputs.window_min }}"
          if [ -z "$WINDOW" ]; then
            WINDOW=10
          fi
          python rescrape_near_deadline.py --date "$DATE" --window-min "$WINDOW"

      # v3モデル用の過去の結果(リリース nar-data)。毎晩更新されるので日付をキーにキャッシュする
      - name: 日付キー
        id: day
        run: echo "d=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: narcache
        with:
          path: data/nar_results.csv
          key: nar-results-${{ steps.day.outputs.d }}
      - name: 過去の結果を取得
        if: steps.narcache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download nar-data --pattern nar_results.csv --dir data --clobber || echo "過去の結果がまだ無いので旧モデルで予想します"

      - name: 予想・ダッシュボード再生成
        working-directory: model
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          fi
          JSONL="../scraper/scraped_data/${DATE}_racecards_raw.jsonl"
          if [ -f "$JSONL" ]; then
            python predict.py --input "$JSONL"
            python generate_dashboard.py --date "$DATE"
          fi

      # 発走120分前からのレースの単勝・馬連・ワイドのオッズを記録し(リリース nar-odds に日ごとのファイル)、
      # その時点のEVを docs/ev_log に保存する。失敗しても予想の更新は続ける
      - name: オッズの記録・EV
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          [ -z "$DATE" ] && DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          pip install beautifulsoup4 lxml >/dev/null
          mkdir -p docs/odds_history
          gh release view nar-odds >/dev/null 2>&1 || gh release create nar-odds --title "地方競馬オッズ履歴(自動)" --notes "締切前10分おきのオッズ(単勝・馬連・ワイド)"
          gh release download nar-odds --pattern "odds_${DATE}.csv" --dir docs/odds_history --clobber 2>/dev/null || true
          python pipeline/nar_odds_snapshot.py --date "$DATE" --window-min 120 || [ $? -eq 2 ]
          if [ -f "docs/odds_history/odds_${DATE}.csv" ]; then
            gh release upload nar-odds "docs/odds_history/odds_${DATE}.csv" --clobber
          fi
          cd model && python generate_dashboard.py --date "$DATE"

      - name: 結果をコミット
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "bot@example.com"
          git add scraper/scraped_data/ docs/
          git diff --cached --quiet || git commit -m "オッズ更新: $(TZ=Asia/Tokyo date +%Y-%m-%d\ %H:%M)"

          # 10分おきに実行されるため、前回の実行がまだ終わっていなかったり、
          # 毎日のスクレイピングと重なったりすると git push が
          # "! [rejected] (fetch first)" で失敗することがある。
          # その場合はリモートの変更を取り込んでリトライする(scraped_data・docs は
          # 今回の実行結果を優先)。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功"
              exit 0
            fi
            echo "push失敗(リモートが先に進んでいます)。取り込んでリトライします ($i/5)"
            git fetch origin main
            if git merge -X ours --no-edit origin/main; then
              continue
            else
              echo "マージに失敗したため中断してリトライします"
              git merge --abort || true
              sleep $((RANDOM % 10 + 5))
            fi
          done

          echo "5回リトライしてもpushできませんでした。次回の実行で改めて取り込まれます。"
          exit 1
