name: 地方競馬 過去結果+払戻の取得

# nar.netkeiba の結果ページから、結果表・払戻表を取得してリリース nar-data に貯める。
# 【初回】Run workflow で start=2022-01-01(end は空欄=今日)。1回5時間で区切り、終わるまで自分を再実行する。
# 【毎日】23:23 JST に、データの最終日の翌日〜今日の分を取り足す(その日の結果も入る → 成績ページ・再学習に使う)。
on:
  schedule:
    - cron: "23 14 * * *"   # JST 23:23
  workflow_dispatch:
    inputs:
      start:
        description: "取得開始日(YYYY-MM-DD)。空欄=続きから/最終日の翌日から"
        required: false
        default: ""
      end:
        description: "取得終了日(YYYY-MM-DD)。空欄=今日"
        required: false
        default: ""
      workers:
        description: "同時取得数"
        required: false
        default: "3"
      max_minutes:
        description: "1回の実行で取得に使う最大時間(分)"
        required: false
        default: "300"
      round:
        description: "自動再実行の回数(内部用)"
        required: false
        default: "1"

concurrency:
  group: nar-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  MAX_ROUNDS: "12"
  FILES: "nar_results.csv nar_payouts.csv nar_progress.json nar_dates_done.json nar_zero_tries.json nar_noresult.json nar_range.txt"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas beautifulsoup4 lxml

      - name: 既存データと途中経過を取得
        run: |
          mkdir -p data
          if gh release view nar-data >/dev/null 2>&1; then
            for f in $FILES; do gh release download nar-data --pattern "$f" --dir data --clobber || true; done
          fi
          ls -la data

      - name: 取得期間を決定
        id: range
        env:
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
        run: |
          today=$(TZ='Asia/Tokyo' date +%F)
          end="${IN_END:-$today}"
          saved=""
          [ -f data/nar_range.txt ] && saved=$(cat data/nar_range.txt)
          if [ -n "$IN_START" ]; then
            start="$IN_START"
          elif [ -n "$saved" ]; then
            read start old_end <<< "$saved"
            echo "::notice::前回の続きから再開: $start 〜 $end"
          elif [ -f data/nar_results.csv ]; then
            last=$(python - <<'PY'
          import pandas as pd
          d = pd.read_csv("data/nar_results.csv", usecols=["race_date"])
          print(d["race_date"].dropna().max())
          PY
          )
            start=$(date -d "$last +1 day" +%F)
          else
            echo "::error::初回は start を指定してください(例: 2022-01-01)"; exit 1
          fi
          if [[ "$start" > "$end" ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$start $end" > data/nar_range.txt
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "### 取得期間: $start 〜 $end" >> "$GITHUB_STEP_SUMMARY"

      - name: 結果と払戻を取得
        id: fetch
        if: steps.range.outputs.skip == 'false'
        env:
          W: ${{ github.event.inputs.workers || '3' }}
          M: ${{ github.event.inputs.max_minutes || '300' }}
        run: |
          set +e
          python pipeline/nar_backfill.py "${{ steps.range.outputs.start }}" "${{ steps.range.outputs.end }}" \
            --out-dir data --workers "$W" --max-minutes "$M"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "結果の行数: $(($(wc -l < data/nar_results.csv) - 1)) / 払戻の行数: $(($(wc -l < data/nar_payouts.csv) - 1))" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then exit "$code"; fi
          # 期間を最後まで処理したら、次回は「最終日の翌日から」にする
          if [ "$code" = "0" ]; then rm -f data/nar_range.txt; fi

      - name: 保存
        if: always() && steps.range.outputs.skip == 'false'
        run: |
          gh release view nar-data >/dev/null 2>&1 || \
            gh release create nar-data --title "地方競馬データ(自動)" --notes "nar_backfill.yml が集めた過去結果・払戻・進捗"
          for f in $FILES; do
            if [ -f "data/$f" ]; then gh release upload nar-data "data/$f" --clobber; fi
          done
          # 範囲ファイルを消した場合はリリースからも消す
          if [ ! -f data/nar_range.txt ]; then gh release delete-asset nar-data nar_range.txt -y 2>/dev/null || true; fi

      # 予想と確定結果を突き合わせて「予測の成績」ページを更新(docs/ は main から GitHub Pages で公開)
      - name: 予測の成績ページを更新
        if: always() && steps.range.outputs.skip == 'false'
        run: |
          pip install numpy >/dev/null
          python pipeline/performance.py scraper/scraped_data data docs/performance.html
          git config user.name "keiba-ai-bot"
          git config user.email "bot@example.com"
          git add docs/performance.html
          git diff --cached --quiet && exit 0
          git commit -q -m "予測の成績を更新 $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1

      - name: 続きを自動で再実行
        if: steps.fetch.outputs.code == '3'
        env:
          ROUND: ${{ github.event.inputs.round || '1' }}
          W: ${{ github.event.inputs.workers || '3' }}
          M: ${{ github.event.inputs.max_minutes || '300' }}
        run: |
          if [ "$ROUND" -ge "$MAX_ROUNDS" ]; then echo "::warning::自動再実行が上限に達しました"; exit 0; fi
          gh workflow run nar_backfill.yml --ref "${GITHUB_REF_NAME}" -f round=$((ROUND + 1)) -f workers="$W" -f max_minutes="$M"
