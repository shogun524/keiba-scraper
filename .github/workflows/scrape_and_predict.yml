name: 南関東競馬 出馬表スクレイピング&予想

on:
  schedule:
    # 毎日 07:00 JST (22:00 UTC 前日) に当日の出馬表を取得
    # 馬体重を使わないモデルなので、前日14時頃の出馬表発表後ならいつでも実行可能
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "取得対象日 (YYYY-MM-DD、空なら翌日)"
        required: false
        default: ""

jobs:
  scrape-and-predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージインストール
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: スクレイピング実行
        working-directory: scraper
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date -d "+1 day" +%Y-%m-%d)
          fi
          python scraper_netkeiba.py --date "$DATE"

      - name: 予想実行
        working-directory: model
        run: |
          for f in ../scraper/scraped_data/*_racecards_raw.jsonl; do
            python predict.py --input "$f"
          done

      - name: ダッシュボードHTML生成
        working-directory: model
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date -d "+1 day" +%Y-%m-%d)
          fi
          python generate_dashboard.py --date "$DATE"

      - name: デバッグ用スクリーンショットをアーティファクト保存
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: scraper/debug_screenshots/
          if-no-files-found: ignore

      - name: 結果をコミット
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "bot@example.com"
          git add scraper/scraped_data/ docs/
          git diff --cached --quiet || git commit -m "自動取得: $(date +%Y-%m-%d)"
          git push
